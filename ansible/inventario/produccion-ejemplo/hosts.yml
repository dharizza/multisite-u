# EJEMPLO: los subsitios de producción. Varios subsitios pueden vivir en el
# mismo servidor (ansible_host igual); Ansible los trata como hosts distintos
# para poder usar --limit y serial por subsitio.
all:
  children:
    subsitios:
      hosts:
        default:
          ansible_host: web1.ejemplo.ucr.ac.cr
          site_dir: default
          site_uri: https://sitio-principal.ejemplo.ucr.ac.cr
        facultad_a:
          ansible_host: web1.ejemplo.ucr.ac.cr
          site_dir: facultad_a
          site_uri: https://facultad-a.ejemplo.ucr.ac.cr
